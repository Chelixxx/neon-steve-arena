<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Платежи — VOLTRA Admin</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090a14;color:#f5f3ff;font:15px system-ui;padding:22px}.wrap{max-width:900px;margin:auto}h1{font-size:clamp(26px,5vw,40px)}.sub{color:#b9b6ce}.item{background:#19172b;border:1px solid #8271ff55;border-radius:18px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{padding:11px 14px;border:0;border-radius:10px;background:#7864ff;color:white;font-weight:800;cursor:pointer}.reject{background:#633044}.partial{background:#73531e}input{padding:10px;border-radius:9px;border:1px solid #6d6593;background:#0f1020;color:white;width:140px}.empty{padding:24px;border:1px dashed #7773;border-radius:16px;color:#b9b6ce}#status{white-space:pre-wrap;color:#c9c1ff}
</style></head><body><main class="wrap"><h1>💸 Очередь оплат VOLTRA</h1><p class="sub">Только для аккаунта chelixxx. Сверяй поступление в банковском приложении вручную перед подтверждением.</p><div id="status">Загружаем…</div><div id="orders"></div><button class="btn" id="refresh">Обновить список</button> <a href="/">Вернуться в VOLTRA</a></main><script>
(()=>{const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toLocaleString('ru-RU');
async function load(){ $('status').textContent='Проверяем доступ…';try{const r=await fetch('/api/payments/manual/admin',{credentials:'same-origin',cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Нет доступа');$('status').textContent='Открытых заявок: '+d.orders.length;if(!d.orders.length){$('orders').innerHTML='<div class="empty">Новых заявок пока нет ✨</div>';return}
$('orders').innerHTML=d.orders.map(o=>'<article class="item" data-id="'+esc(o.id)+'"><div class="row"><b>🔔 '+esc(o.username)+' · '+esc(o.title)+'</b><b>'+fmt(o.price)+' ₽</b></div><p class="sub">Заказ: '+esc(o.id)+'<br>Создан: '+new Date(o.createdAt).toLocaleString()+'</p><div class="buttons"><button class="btn" data-decision="full">✓ Оплачено полностью</button>'+(o.kind==='vlt'?'<label>Получено ₽ <input type="number" min="0.01" step="0.01" data-paid placeholder="Сумма"></label><button class="btn partial" data-decision="partial">Оплачено частично</button>':'')+'<button class="btn reject" data-decision="reject">✕ Ничего не пришло — отклонить</button></div></article>').join('')}
catch(e){$('status').textContent=e.message;$('orders').innerHTML=''}}
async function decide(id,decision,paidRub){const r=await fetch('/api/payments/manual/admin/decide',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({orderId:id,decision,paidRub})});const d=await r.json();if(!r.ok)throw Error(d.error||'Не удалось обработать');return d}
$('orders').onclick=async e=>{const b=e.target.closest('button[data-decision]');if(!b)return;const card=b.closest('[data-id]'),decision=b.dataset.decision;let paidRub;if(decision==='partial'){paidRub=Number(card.querySelector('[data-paid]')?.value);if(!Number.isFinite(paidRub)||paidRub<=0){alert('Введи фактически полученную сумму в рублях.');return}}
if(decision==='full'&&!confirm('Подтвердил поступление полной суммы в банковском приложении?'))return;if(decision==='reject'&&!confirm('Отклонить заказ без начисления?'))return;if(decision==='partial'&&!confirm('Начислить валюту пропорционально '+paidRub+' ₽?'))return;
b.disabled=true;try{const d=await decide(card.dataset.id,decision,paidRub);alert(decision==='partial'?'Начислено '+fmt(d.grantedAmount)+' ϟ за '+fmt(d.paidRub)+' ₽.':'Заказ обработан: '+d.status);await load()}catch(err){alert(err.message);b.disabled=false}};
$('refresh').onclick=load;load();setInterval(load,30000)})();
</script></body></html>
