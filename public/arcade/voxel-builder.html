<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0a1020"><title>Voxel Builder — Pulse Arcade</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1020;color:#f4f6ff;font:14px system-ui,-apple-system,sans-serif;overscroll-behavior:none}body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:#10182a;border-bottom:1px solid #4f75a444}.brand{font-weight:900;letter-spacing:.8px;white-space:nowrap}.brand span{color:#7ce8bb}.stats{font-size:10px;color:#b9c7df}.top-actions{display:flex;gap:5px}.top-btn{min-width:40px;min-height:40px;border:1px solid #53658466;border-radius:10px;background:#1a253a;color:#eaf0ff;font-size:18px;font-weight:800;touch-action:manipulation}.world{flex:1;min-height:0;position:relative;background:linear-gradient(#8ed6e733,#182e4d22 55%,#152c2b55)}canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:8px;background:#0f1627;border-top:1px solid #4f75a444}.tool{min-height:42px;border:1px solid #53658466;border-radius:10px;background:#1a253a;color:#eaf0ff;padding:9px 12px;font-weight:750;font-size:12px;touch-action:manipulation}.tool.active{border-color:#72e8b4;background:#193c3a;box-shadow:0 0 12px #72e8b422}.palette{display:flex;gap:7px;flex:1;min-width:100%;overflow-x:auto;padding:2px 0 5px;scrollbar-width:thin;overscroll-behavior-x:contain}.swatch{min-width:42px;height:40px;border:2px solid #66718b66;border-radius:10px;touch-action:manipulation}.swatch.active{border-color:#fff;box-shadow:0 0 0 2px #72e8b4}.hint{font-size:11px;color:#aab8d3;padding:0 10px 8px;background:#0f1627;line-height:1.4}.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#0a1020e8;border:1px solid #72e8b477;border-radius:10px;padding:8px 12px;font-size:11px;white-space:nowrap;pointer-events:none}.hidden{display:none!important}@media(max-width:430px){.brand{font-size:12px}.stats{font-size:9px}.bar{gap:5px;padding:6px}.top-btn{min-width:38px;min-height:38px}.tools{gap:5px;padding:6px}.tool{flex:1;padding:8px 5px;font-size:11px}.hint{font-size:10px}}
</style></head><body>
<header class="bar"><div><div class="brand">🧱 VOXEL <span>BUILDER</span></div><div class="stats" id="stats">Кубов: 0 · Мир: 16×16</div></div><div class="top-actions"><button class="top-btn" id="zoomOut" aria-label="Уменьшить">−</button><button class="top-btn" id="zoomIn" aria-label="Увеличить">＋</button><button class="top-btn" id="full" aria-label="На весь экран">⛶</button></div></header>
<div class="world"><canvas id="world" aria-label="Мир из блоков"></canvas><div class="toast hidden" id="toast"></div></div>
<div class="tools"><button class="tool active" id="place">＋ Строить</button><button class="tool" id="remove">− Убирать</button><button class="tool" id="save">💾 Сохранить</button><button class="tool" id="reset">↻ Новый мир</button></div>
<div class="tools" style="padding-top:0"><div class="palette" id="palette"></div></div>
<div class="hint">Нажми на верх блока, чтобы добавить выбранный куб. В режиме «Убирать» снимается верхний блок. Это спокойная творческая песочница без сражений.</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),stats=document.getElementById('stats'),toastEl=document.getElementById('toast');
const blocks=[{id:'grass',name:'Трава',top:'#69bd75',left:'#408354',right:'#347149'},{id:'dirt',name:'Земля',top:'#b88758',left:'#805739',right:'#6d472f'},{id:'stone',name:'Камень',top:'#b4c0cd',left:'#77879a',right:'#5d6d80'},{id:'wood',name:'Дерево',top:'#e2b777',left:'#a36b3c',right:'#82522f'},{id:'leaves',name:'Листва',top:'#62d49b',left:'#2e966c',right:'#237a57'},{id:'water',name:'Вода',top:'#5caeff',left:'#3478c7',right:'#285da7'},{id:'sand',name:'Песок',top:'#f0d68c',left:'#c3a85f',right:'#9c8447'}];
const N=16,BH=15,TW=34,TH=18;let map=[],selected='grass',mode='place',scale=1,zoom=1,originX=0,originY=0,dpr=1;
function makeWorld(){map=Array.from({length:N},(_,x)=>Array.from({length:N},(_,y)=>{const r=Math.sin(x*.62)*Math.cos(y*.48)+Math.sin((x+y)*.27)*.65;const h=(x>3&&x<12&&y>3&&y<12&&r>1.05)?2:(r>1.18?1:0);return Array.from({length:h+1},(_,z)=>z===0?'grass':(z===1?'dirt':'stone'))}));}
function project(x,y,z){return [originX+(x-y)*TW*scale/2,originY+(x+y)*TH*scale/2-z*BH*scale]}
function resize(){const rect=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(rect.width*dpr));canvas.height=Math.max(1,Math.floor(rect.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(rect.width/(N*TW*.9),rect.height/(N*TH*1.15))*zoom;scale=Math.max(.35,Math.min(scale,2.1));originX=rect.width/2;originY=Math.max(35,rect.height*.18);draw()}
function poly(points,fill,stroke){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.7;ctx.stroke()}}
function topPts(x,y,z){const [sx,sy]=project(x,y,z);return [[sx,sy],[sx+TW*scale/2,sy+TH*scale/2],[sx,sy+TH*scale],[sx-TW*scale/2,sy+TH*scale/2]]}
function draw(){const rect=canvas.getBoundingClientRect();ctx.clearRect(0,0,rect.width,rect.height);const all=[];for(let x=0;x<N;x++)for(let y=0;y<N;y++)for(let z=0;z<map[x][y].length;z++)all.push({x,y,z,id:map[x][y][z]});all.sort((a,b)=>(a.x+a.y)-(b.x+b.y)||a.z-b.z);for(const b of all){const spec=blocks.find(a=>a.id===b.id)||blocks[0],p=topPts(b.x,b.y,b.z),down=BH*scale;poly([p[3],p[2],[p[2][0],p[2][1]+down],[p[3][0],p[3][1]+down]],spec.left,'#0b152c44');poly([p[2],p[1],[p[1][0],p[1][1]+down],[p[2][0],p[2][1]+down]],spec.right,'#0b152c55');poly(p,spec.top,'#0b152c66');}
stats.textContent='Кубов: '+map.reduce((n,a)=>n+a.length,0)+' · Мир: '+N+'×'+N}
function hit(px,py){const rect=canvas.getBoundingClientRect();px-=rect.left;py-=rect.top;const all=[];for(let x=0;x<N;x++)for(let y=0;y<N;y++){const z=map[x][y].length-1;all.push({x,y,z,pts:topPts(x,y,z)})}all.sort((a,b)=>(b.x+b.y)-(a.x+a.y)||b.z-a.z);for(const a of all){const p=a.pts;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();if(ctx.isPointInPath(px,py))return a}const dx=(px-originX)/(TW*scale/2),dy=(py-originY)/(TH*scale/2);const x=Math.floor((dx+dy)/2),y=Math.floor((dy-dx)/2);if(x>=0&&x<N&&y>=0&&y<N)return{x,y,z:map[x][y].length-1};return null}
function say(s){toastEl.textContent=s;toastEl.classList.remove('hidden');clearTimeout(say.t);say.t=setTimeout(()=>toastEl.classList.add('hidden'),1800)}
canvas.addEventListener('pointerdown',e=>{const a=hit(e.clientX,e.clientY);if(!a)return;if(mode==='place'){if(map[a.x][a.y].length>=8){say('Здесь уже высокая башня');return}map[a.x][a.y].push(selected)}else{if(map[a.x][a.y].length<=1){say('Нижний слой оставлен как земля');return}map[a.x][a.y].pop()}draw()});
const palette=document.getElementById('palette');for(const b of blocks){const btn=document.createElement('button');btn.className='swatch'+(b.id===selected?' active':'');btn.title=b.name;btn.setAttribute('aria-label',b.name);btn.style.background='linear-gradient(135deg,'+b.top+','+b.left+')';btn.onclick=()=>{selected=b.id;palette.querySelectorAll('button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');say('Выбран блок: '+b.name)};palette.append(btn)}
document.getElementById('place').onclick=()=>{mode='place';document.getElementById('place').classList.add('active');document.getElementById('remove').classList.remove('active')};document.getElementById('remove').onclick=()=>{mode='remove';document.getElementById('remove').classList.add('active');document.getElementById('place').classList.remove('active')};
function save(){try{localStorage.setItem('pulseVoxelWorld',JSON.stringify(map));say('Мир сохранён на этом устройстве')}catch{say('Не удалось сохранить мир')}}
document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(1.8,zoom+.15);resize()};document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(.65,zoom-.15);resize()};document.getElementById('full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else{document.exitFullscreen?.()}};document.getElementById('save').onclick=save;document.getElementById('reset').onclick=()=>{if(confirm('Создать новый мир? Сначала нажми «Сохранить», если хочешь оставить текущий.')){makeWorld();draw();say('Новый мир создан')}};try{const old=JSON.parse(localStorage.getItem('pulseVoxelWorld')||'null');if(Array.isArray(old)&&old.length===N&&old.every(a=>Array.isArray(a)&&a.length===N&&a.every(col=>Array.isArray(col)&&col.length<9&&col.every(id=>blocks.some(b=>b.id===id)))))map=old;else makeWorld()}catch{makeWorld()}window.addEventListener('resize',resize);document.addEventListener('fullscreenchange',resize);document.addEventListener('visibilitychange',()=>{if(!document.hidden)resize()});resize();
})();
</script></body></html>
