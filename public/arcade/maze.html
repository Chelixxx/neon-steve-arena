<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080b17"><title>Neon Maze — Pulse Arcade</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at top,#18204a,#080b17 70%);color:#f4f5ff;font:14px system-ui,sans-serif}body{display:flex;flex-direction:column;padding:10px;gap:8px}.top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-weight:900;letter-spacing:1px}.title span{color:#5df4f0}.stats{display:flex;gap:6px;font-size:11px}.pill{padding:6px 9px;border:1px solid #6068a355;background:#11172bcc;border-radius:10px}.board{flex:1;min-height:0;display:grid;place-items:center}.canvas-wrap{width:100%;height:100%;max-height:calc(100dvh - 145px);display:grid;place-items:center}canvas{display:block;max-width:100%;max-height:100%;border-radius:12px;border:1px solid #5df4f066;box-shadow:0 0 30px #5df4f018;background:#090d1b;image-rendering:pixelated}.hint{font-size:10px;color:#9da6c7;line-height:1.4}.reset,.card button{border:0;border-radius:10px;padding:10px 13px;background:linear-gradient(100deg,#9b7cff,#5df4f0);color:#080b17;font-weight:900}.controls{display:none;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,34px);gap:5px}.controls button{border:1px solid #5df4f066;border-radius:9px;background:#151c32;color:#eafcff;font-size:16px;touch-action:manipulation}.controls [data-dir=up]{grid-column:2}.controls [data-dir=left]{grid-column:1;grid-row:2}.controls [data-dir=down]{grid-column:2;grid-row:2}.controls [data-dir=right]{grid-column:3;grid-row:2}.overlay{position:fixed;inset:0;background:#050714d9;display:grid;place-items:center;padding:22px;text-align:center}.card{max-width:360px;padding:24px;border:1px solid #5df4f066;border-radius:20px;background:linear-gradient(145deg,#161d38,#0b0e1d);box-shadow:0 0 45px #9b7cff20}.card h1{margin:0 0 10px;color:#5df4f0}.card p{font-size:12px;color:#c5cbe4;line-height:1.6}.hidden{display:none!important}@media(max-width:600px){body{padding:8px}.controls{display:grid}.canvas-wrap{max-height:calc(100dvh - 185px)}.hint{max-width:52%}.stats{gap:4px}.pill{padding:5px 6px}}
</style></head><body><div class="top"><div class="title">✦ NEON <span>MAZE</span></div><div class="stats"><div class="pill">💎 <b id="score">0/6</b></div><div class="pill">Шаги <b id="steps">0</b></div></div></div><div class="board"><div class="canvas-wrap"><canvas id="game" width="600" height="600"></canvas></div></div><div class="bottom"><div class="hint">WASD / стрелки — двигаться<br>Собери 6 кристаллов и найди портал</div><div class="controls"><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><button class="reset" id="reset">↻ Заново</button></div><div class="overlay" id="overlay"><div class="card"><h1 id="overlayTitle">Neon Maze</h1><p id="overlayText">Найди путь через лабиринт, собери 6 кристаллов и доберись до портала.</p><button id="start">Начать игру</button></div></div><script>
(()=>{'use strict';const map=['###############','#S....#.......#','###.#.#.#####.#','#...#...#...#.#','#.#####.#.#.#.#','#.....#...#...#','#.###.#####.###','#...#.....#...#','###.#####.#.#.#','#...#...#...#.#','#.###.#.#####.#','#.....#.......#','#.#########.#.#','#......D....E.#','###############'];const c=document.getElementById('game'),ctx=c.getContext('2d');let grid,p,crystals,steps,started=false,won=false;const total=6;function init(){grid=map.map(r=>r.split(''));p={x:1,y:1};crystals=[[3,1],[9,1],[13,3],[1,7],[7,9],[11,13]].map(([x,y])=>({x,y}));steps=0;won=false;started=false;document.getElementById('overlay').classList.remove('hidden');document.getElementById('overlayTitle').textContent='Neon Maze';document.getElementById('overlayText').textContent='Собери 6 кристаллов и найди портал ✦';document.getElementById('start').textContent='Начать игру';update();draw()}function update(){document.getElementById('score').textContent=(total-crystals.length)+'/'+total;document.getElementById('steps').textContent=steps}function draw(){const cols=grid[0].length,rows=grid.length,cell=Math.floor(600/Math.max(cols,rows));c.width=cols*cell;c.height=rows*cell;ctx.fillStyle='#080c1b';ctx.fillRect(0,0,c.width,c.height);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const wall=grid[y][x]==='#';ctx.fillStyle=wall?'#1b2547':'#0c1227';ctx.fillRect(x*cell,y*cell,cell-1,cell-1);if(wall){ctx.strokeStyle='#5864b855';ctx.strokeRect(x*cell+2,y*cell+2,cell-5,cell-5)}}ctx.fillStyle='#ff79cf';ctx.shadowBlur=12;ctx.shadowColor='#ff79cf';ctx.beginPath();ctx.arc((13+.5)*cell,(13+.5)*cell,cell*.28,0,Math.PI*2);ctx.fill();for(const a of crystals){ctx.save();ctx.translate((a.x+.5)*cell,(a.y+.5)*cell);ctx.rotate(Math.PI/4);ctx.fillStyle='#5df4f0';ctx.shadowBlur=12;ctx.shadowColor='#5df4f0';ctx.fillRect(-cell*.16,-cell*.16,cell*.32,cell*.32);ctx.restore()}ctx.shadowBlur=0;ctx.fillStyle='#b4a1ff';ctx.shadowBlur=15;ctx.shadowColor='#9b7cff';ctx.beginPath();ctx.arc((p.x+.5)*cell,(p.y+.5)*cell,cell*.28,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}function move(dx,dy){if(!started||won)return;let x=p.x+dx,y=p.y+dy;if(!grid[y]||grid[y][x]==='#')return;p={x,y};steps++;const i=crystals.findIndex(a=>a.x===x&&a.y===y);if(i>=0)crystals.splice(i,1);update();draw();if(x===13&&y===13){if(!crystals.length){won=true;started=false;document.getElementById('overlay').classList.remove('hidden');document.getElementById('overlayTitle').textContent='Победа! ✨';document.getElementById('overlayText').textContent='Все кристаллы собраны за '+steps+' шагов!';document.getElementById('start').textContent='Играть снова'}else{started=false;document.getElementById('overlay').classList.remove('hidden');document.getElementById('overlayTitle').textContent='Почти!';document.getElementById('overlayText').textContent='Осталось кристаллов: '+crystals.length;document.getElementById('start').textContent='Продолжить'}}}document.getElementById('start').onclick=()=>{if(won)init();started=true;document.getElementById('overlay').classList.add('hidden')};document.getElementById('reset').onclick=init;const keys={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};document.addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();move(...keys[e.key])}});const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};document.querySelectorAll('[data-dir]').forEach(b=>{b.addEventListener('click',()=>move(...dirs[b.dataset.dir]));b.addEventListener('touchstart',e=>{e.preventDefault();move(...dirs[b.dataset.dir])},{passive:false})});init()})();
</script></body></html>
