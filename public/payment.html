<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оплата — VOLTRA</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090a14;color:#f5f3ff;font:16px system-ui,Arial;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(620px,100%);background:linear-gradient(145deg,#19172b,#10111d);border:1px solid #8271ff55;border-radius:24px;padding:clamp(20px,5vw,36px);box-shadow:0 20px 80px #0008}.brand{color:#a99aff;font-weight:900;letter-spacing:3px}.muted{color:#b9b6ce;line-height:1.55}.price{font-size:clamp(28px,6vw,42px);font-weight:900;margin:12px 0}.timer{font-size:54px;font-weight:900;text-align:center;color:#c5b8ff;margin:18px 0}.notice{background:#2d2517;border:1px solid #8e6b2f;padding:14px;border-radius:14px;line-height:1.5}.btn{width:100%;padding:15px;border:0;border-radius:13px;background:#7864ff;color:white;font-weight:800;font-size:16px;margin-top:12px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.status{margin-top:14px;line-height:1.5}.small{font-size:13px;color:#aaa6bf}a{color:#c8beff}
</style></head><body><main class="card"><div class="brand">VOLTRA · ПЛАТЁЖ</div><h1>Подтверждение заказа</h1><div id="product" class="price">Создаём заказ…</div><p id="details" class="muted"></p><div id="requisites" class="notice">⏳ Загружаем реквизиты оплаты…</div><div id="timer" class="timer">03:00</div><p class="muted">После окончания таймера кнопка отправит администратору заявку «проверьте поступление». Это не подтверждает платёж автоматически.</p><button id="claim" class="btn" disabled>Подождите 1 минуту</button><div id="status" class="status" role="status"></div><p class="small">Не закрывай страницу до отправки заявки. <a href="/">Вернуться в VOLTRA</a></p></main>
<script>
(()=>{const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const product=params.get('product')||'';let order=null,deadline=0,timerId=null;
const fmt=n=>Number(n||0).toLocaleString('ru-RU');const titles={vip_monthly:['VOLTRA VIP · 1 месяц',399],vlt_500:['500 ϟ',50],vlt_5000:['5 000 ϟ',475],vlt_25000:['25 000 ϟ',2250],vlt_100000:['100 000 ϟ',8000],vlt_250000:['250 000 ϟ',15000],vlt_1000000:['1 000 000 ϟ',50000]};
async function loadRequisites(){try{const r=await fetch('/api/payments/manual/requisites',{credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(10000)});const d=await r.json();if(!r.ok)throw Error(d.error||'Реквизиты недоступны');$('requisites').innerHTML='💳 <b>Перевод по реквизитам:</b><br><code></code><br><button type="button" class="btn" id="copyCard">Скопировать реквизиты</button><p class="small">Проверь получателя и сумму перед переводом.</p>';$('requisites').querySelector('code').textContent=d.payCard;document.getElementById('copyCard').onclick=()=>navigator.clipboard.writeText(d.payCard).then(()=>{$('status').textContent='Реквизиты скопированы.'}).catch(()=>{$('status').textContent='Не удалось скопировать — выдели реквизиты вручную.'})}catch(e){$('requisites').textContent=e.message+' Не переводите деньги, пока реквизиты не отображаются.'}}
async function init(){loadRequisites();if(!titles[product]){ $('product').textContent='Товар не выбран';$('status').textContent='Вернись в магазин и выбери пакет.';return}
$('product').textContent=titles[product][0];$('details').textContent='К оплате: '+fmt(titles[product][1])+' ₽ · Заказ создаётся после входа в VOLTRA.';
try{const r=await fetch('/api/payments/manual/orders',{method:'POST',credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(15000),headers:{'content-type':'application/json'},body:JSON.stringify({product})});const d=await r.json();if(!r.ok)throw Error(d.error||'Не удалось создать заказ');order=d.order;if(!order||!order.id)throw Error('Сервер не вернул номер заказа');deadline=order.claimAfter||Date.now()+60000;$('status').textContent='Заказ № '+order.id.slice(0,8)+' создан. '+d.notice;tick()}catch(e){$('product').textContent=titles[product][0];$('status').textContent=(e.name==='TimeoutError'?'Сервер не ответил вовремя. ':e.message+' — ')+'Проверь вход в VOLTRA и обнови страницу.';$('claim').disabled=true;$('timer').textContent='—';}}
function tick(){clearInterval(timerId);const update=()=>{const left=Math.max(0,deadline-Date.now());$('timer').textContent=String(Math.floor(left/60000)).padStart(2,'0')+':'+String(Math.floor(left%60000/1000)).padStart(2,'0');$('claim').disabled=left>0||!order;$('claim').textContent=left>0?'Подождите 1 минуту':'Я перевёл(а) — проверить поступление';if(left===0)clearInterval(timerId)};update();timerId=setInterval(update,250)}
$('claim').onclick=async()=>{if(!order)return;$('claim').disabled=true;$('claim').textContent='Отправляем…';try{const r=await fetch('/api/payments/manual/claim',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({orderId:order.id})});const d=await r.json();if(!r.ok)throw Error(d.error||'Не удалось отправить');$('status').textContent=d.notice||'Заявка отправлена.';$('claim').textContent='Заявка отправлена ✓'}catch(e){$('status').textContent=e.message;$('claim').disabled=false;$('claim').textContent='Повторить отправку'}};
init()})();
</script></body></html>
