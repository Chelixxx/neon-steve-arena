name: Build VOLTRA Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voltra-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Publish preview APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview
          name: VOLTRA Android Preview
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Автоматическая тестовая сборка VOLTRA для Android.
            Это предварительная версия; для установки может потребоваться разрешить установку из этого источника.
