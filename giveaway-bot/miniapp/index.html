<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#100d1d"><title>Челикс Гифтс</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#100d1d;--card:#1b1630;--purple:#9b68ff;--muted:#a99fbd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#30204c,var(--bg) 58%);color:#fff;font:15px system-ui,-apple-system,sans-serif;padding:22px 16px 40px}
header{display:flex;align-items:center;gap:13px;margin:8px 0 22px}.avatar{width:54px;height:54px;border-radius:18px;background:#30234b;object-fit:cover}.sub{color:var(--muted);font-size:13px}
h1{font-size:23px;margin:0 0 3px}.card{background:linear-gradient(145deg,#251d3c,#191426);border:1px solid #ffffff12;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 10px 30px #0003}
h2{font-size:16px;margin:0 0 13px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#ffffff08;padding:13px;border-radius:14px}.num{font-size:25px;font-weight:800}.muted{color:var(--muted);font-size:12px}
button{width:100%;border:0;border-radius:14px;padding:14px;margin:5px 0;background:linear-gradient(100deg,#8652ed,#b06aff);color:white;font-weight:700;font-size:14px}
button.secondary{background:#ffffff12;border:1px solid #ffffff16}button:disabled{opacity:.5}
.person{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #ffffff12}.person:last-child{border:0}.tag{color:#c5a5ff;font-size:12px}.hidden{display:none}.notice{padding:12px;border-radius:12px;background:#ffffff10;color:#e9ddff;margin:12px 0}
</style></head><body>
<header><img id="avatar" class="avatar" alt=""><div><h1>Челикс Гифтс</h1><div id="hello" class="sub">Загрузка профиля…</div></div></header>
<div id="notice" class="notice hidden"></div>
<section class="card"><h2>👤 Твой профиль</h2><div class="stats"><div class="stat"><div id="wins" class="num">—</div><div class="muted">Побед</div></div><div class="stat"><div id="rank" class="num">—</div><div class="muted">Место в рейтинге</div></div></div><div id="breakdown" class="sub" style="margin-top:12px">Пока нет побед</div></section>
<section class="card"><h2>🏆 Рейтинг участников</h2><div id="top" class="sub">Загружаем рейтинг…</div></section>
<section id="admin" class="card hidden"><h2>🛠 Меню владельца</h2><div class="stats"><div class="stat"><div id="bear" class="num">0:00</div><div class="muted">Буст Мишек</div></div><div class="stat"><div id="nft" class="num">0:00</div><div class="muted">NFT-буст</div></div></div><button id="bearBtn">🧸 Включить буст Мишек · 3 мин</button><button id="nftBtn">⚔️ Включить NFT-буст · 3 мин</button><button id="stopBtn" class="secondary">Остановить бусты</button><div id="adminInfo" class="sub"></div></section>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const $=id=>document.getElementById(id), init=tg?.initData||"";
function notice(s){$("notice").textContent=s;$("notice").classList.remove("hidden")}
async function api(path,body){const r=await fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","X-Telegram-Init-Data":init},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||"Ошибка запроса");return d}
function timer(n){return Math.floor(n/60)+":"+String(n%60).padStart(2,"0")}
function render(d){const u=d.user;$("hello").textContent=(u.username?"@"+u.username:u.name)+(u.is_owner?" · владелец":"");if(u.photo){$("avatar").src=u.photo}else{$("avatar").src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Crect width='60' height='60' rx='18' fill='%233a2857'/%3E%3Ctext x='30' y='39' text-anchor='middle' font-size='30'%3E🎁%3C/text%3E%3C/svg%3E"}
$("wins").textContent=d.profile.total||0;const idx=d.top.findIndex(x=>String(x.id)===String(u.id));$("rank").textContent=idx<0?"—":"#"+(idx+1);
const labels=d.prize_labels||{};const parts=Object.entries(d.profile.prizes||{}).map(([k,v])=>(labels[k]||k)+": "+v);$("breakdown").textContent=parts.join(" · ")||"Твои победы появятся здесь";
$("top").innerHTML=d.top.length?d.top.map((x,i)=>'<div class="person"><span>'+(["🥇","🥈","🥉"][i]||("#"+(i+1)))+" "+escapeHtml(x.name)+'</span><b>'+x.total+'</b></div>').join(""):"Пока нет победителей";
$("admin").classList.toggle("hidden",!u.is_owner);if(u.is_owner){$("bear").textContent=timer(d.boosts.bear_seconds);$("nft").textContent=timer(d.boosts.nft_seconds);$("adminInfo").textContent="В игнор-листе: "+d.ignored_count}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function act(action){try{const d=await api("/api/admin",{action});notice(d.message);await load()}catch(e){notice(e.message)}}
async function load(){try{if(!init)throw Error("Открой Mini App через кнопку в Telegram.");render(await api("/api/data"))}catch(e){notice(e.message)}}
$("bearBtn").onclick=()=>act("bear_boost");$("nftBtn").onclick=()=>act("nft_boost");$("stopBtn").onclick=()=>act("stop_boosts");load();
</script></body></html>
